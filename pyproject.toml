[project]
name = "audioscribe"
version = "0.5.0"
description = "CLI that turns any speech (meetings, audio books, videos, live sound) into text, subtitles, JSON and AI notes, with AssemblyAI or local Whisper"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eslam Sife", email = "eslamsife91@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["transcription", "speech-to-text", "assemblyai", "whisper", "subtitles", "srt", "vtt", "audio", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "anthropic>=1.3.0",
    "assemblyai>=1.0.0",
    "faster-whisper>=1.2.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "sounddevice>=0.5.6",
    "typer>=0.27.2",
    "yt-dlp>=2026.8.19",
]

[project.urls]
Homepage = "https://github.com/EslamSife/audioscribe"
Issues = "https://github.com/EslamSife/audioscribe/issues"
Changelog = "https://github.com/EslamSife/audioscribe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Local speaker labels for Whisper. Heavy: pulls in PyTorch.
speakers = [
    "pyannote.audio>=4.0,<5",
]
# Notes with GPT, Gemini, Ollama or any OpenAI-compatible server
openai = [
    "openai>=3.31.0",
]
all = [
    "audioscribe[speakers,openai]",
]

[project.scripts]
transcribe = "transcribe.cli:app"

[tool.uv.build-backend]
# The PyPI name is 'audioscribe'; the import package and command stay 'transcribe'
module-name = "transcribe"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
