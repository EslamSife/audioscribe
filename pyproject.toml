[project]
name = "transcribe"
version = "0.2.0"
description = "Fast, modular CLI for transcribing audio/video to text, markdown, subtitles, and JSON via AssemblyAI or Local Whisper"
readme = "README.md"
authors = [
    { name = "Eslam Sife", email = "eslamsife91@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["transcription", "speech-to-text", "assemblyai", "whisper", "subtitles", "srt", "vtt", "audio", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "anthropic>=1.3.0",
    "assemblyai>=1.0.0",
    "faster-whisper>=1.2.1",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "sounddevice>=0.5.6",
    "typer>=0.27.2",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
local = [
    "faster-whisper>=1.0.0",
]
live = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
]
url = [
    "yt-dlp>=2024.0.0",
]
speakers = [
    "pyannote.audio>=3.1.0",
]
all = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "yt-dlp>=2024.0.0",
]

[project.scripts]
transcribe = "transcribe.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
