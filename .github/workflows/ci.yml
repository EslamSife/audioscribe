name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# The workflow only reads the code
permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      # Actions are pinned to a commit, so a moved tag can't change what runs here
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The 'speakers' extra (PyTorch, several GB) is left out; its contract tests skip
      - name: Install dependencies
        run: uv sync --locked --extra openai --dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Pytest Suite
        run: uv run pytest

      - name: Build package
        run: uv build
